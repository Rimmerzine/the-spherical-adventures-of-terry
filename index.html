<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
      crossorigin="anonymous"
    />
    <style>
      .navbar-solid {
        height: 5em;
      }
      #canvas-container {
        height: calc(100vh - 5em);
      }
      h1 {
        user-select: none;
      }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Spherical Adventures of Terry</title>
  </head>
  <body>
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="statsOffcanvas"
      aria-labelledby="statsOffcanvasLabel"
    >
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="statsOffcanvasLabel">Stats</h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <dl>
          <dt>Acceleration</dt>
          <dd><span id="acceleration-attribute">1</span>m per second</dd>
          <dt>Weight</dt>
          <dd><span id="weight-attribute">1</span>kg</dd>
          <dt>Grip</dt>
          <dd id="grip-attribute">Smooth</dd>
          <dt>Jumps</dt>
          <dd id="jump-attribute">0</dd>
          <dt>Max speed</dt>
          <dd id="max-speed-attribute">5</dd>
        </dl>
      </div>
    </div>
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="upgradesOffcanvas"
      aria-labelledby="upgradesOffcanvasLabel"
    >
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="upgradesOffcanvasLabel">Upgrades</h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <p>Total points: 0</p>
        <div class="row gy-4">
          <div class="col-4">
            <button
              title="The ball will reach it's top speed more quickly"
              id="upgrade-speed-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade acceleration<br />(1 point)
            </button>
          </div>
          <div class="col-4">
            <button
              title="The ball will bounce less"
              id="upgrade-weight-button"
              type="button"
              class="btn btn-success"
            >
              Reduce Bounce<br />(1 point)
            </button>
          </div>
          <div class="col-4">
            <button
              title="The ball will climb hills much easier"
              id="upgrade-grip-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Grip<br />(1 point)
            </button>
          </div>
          <div class="col-4">
            <button
              title="Press space to jump"
              id="upgrade-jump-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Jump<br />(1 point)
            </button>
          </div>
          <div class="col-4">
            <button
              title="Increase how fast your ball can move"
              id="upgrade-max-speed-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Max Speed<br />(1 point)
            </button>
          </div>
        </div>
      </div>
    </div>
    <nav id="navbar" class="navbar bg-dark navbar-solid" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand"><h1>The Spherical Adventures of Terry</h1></a>
        <div class="d-flex">
          <button
            class="btn btn-primary me-4"
            type="button"
            id="reset-level-button"
          >
            Reset Level
          </button>
          <button
            class="btn btn-primary me-4"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#statsOffcanvas"
            aria-controls="statsOffcanvas"
          >
            Stats
          </button>
          <button
            class="btn btn-primary me-4"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#upgradesOffcanvas"
            aria-controls="upgradesOffcanvas"
          >
            Upgrades
          </button>
        </div>
      </div>
    </nav>
    <div id="canvas-container">
      <canvas></canvas>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="javascripts/index.js"></script>
  </body>
</html>
