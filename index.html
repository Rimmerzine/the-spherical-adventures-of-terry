<!doctype html>
<html>
    <head>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="manifest" href="manifest.json" />
        <style>
            canvas {
                display: block;
            }
            h1 {
                user-select: none;
            }
            dt:first-child {
                padding-top: 1em;
            }
            dt:not(:first-child) {
                margin-top: 1em;
                padding-top: 1em;
                border-top: 1px gray solid;
            }
        </style>
        <title>The Spherical Adventures of Terry</title>
        <meta name="viewport" content="width=device-width, initial-scale=0.5, user-scalable=no" />
        <meta charset="utf-8" />
        <meta name="theme-color" content="#ffff00" />
    </head>
    <body>
        <nav id="navbar" class="navbar bg-dark navbar-solid" data-bs-theme="dark">
            <div class="container-fluid">
                <span class="navbar-text"><h1>The Spherical Adventures of Terry</h1></span>
                <div class="d-flex">
                    <div class="dropdown">
                        <button class="btn btn-primary dropdown-toggle me-4" type="button" data-bs-toggle="dropdown" aria-expanded="false">Reset Level</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <button class="dropdown-item" id="reset-level-grasslands">Grasslands (Normal)</button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="reset-level-tarmac">Tarmac (maximum surface grip)</button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="reset-level-ice">Ice (very low surface grip)</button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="reset-level-hell">Hell (experimental, zero bounce)</button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="reset-level-moon">Moon (Low gravity)</button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="reset-level-holymoly">Holy Moly (New feature: holes)</button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <canvas style="transform: translateZ(0)" id="canvas"></canvas>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
