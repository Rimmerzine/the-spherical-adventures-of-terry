<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      canvas {
        display: block;
      }
      h1 {
        user-select: none;
      }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.75, user-scalable=no" />
    <title>The Spherical Adventures of Terry</title>
  </head>
  <body>
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="statsOffcanvas"
      aria-labelledby="statsOffcanvasLabel"
    >
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="statsOffcanvasLabel">Stats</h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <dl>
          <dt>Acceleration</dt>
          <dd>
            <span id="acceleration-attribute">0.25</span> revolutions per second
          </dd>
          <dt>Grip</dt>
          <dd id="grip-attribute">1</dd>
          <dt>Jumps</dt>
          <dd id="jumps-attribute">0</dd>
          <dt>Max RPS</dt>
          <dd id="max-rps-attribute">0.5</dd>
        </dl>
      </div>
    </div>
    <div
      class="offcanvas offcanvas-end"
      tabindex="-1"
      id="upgradesOffcanvas"
      aria-labelledby="upgradesOffcanvasLabel"
    >
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="upgradesOffcanvasLabel">Upgrades</h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <p>Total points: <span id="total-points-attribute">0</span></p>
        <div class="row gy-4">
          <div class="col-4">
            <button
              title="The ball will reach it's top speed more quickly"
              id="upgrade-acceleration-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade acceleration<br />(<span id="upgrade-acceleration-cost"
                >4</span
              >
              points)
            </button>
          </div>
          <div class="col-4">
            <button
              title="The ball will climb hills much easier"
              id="upgrade-grip-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Grip<br />(<span id="upgrade-grip-cost">8</span> points)
            </button>
          </div>
          <div class="col-4">
            <button
              title="Increase how many times you can jump (space)"
              id="upgrade-jumps-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Jumps<br />(<span id="upgrade-jumps-cost">10</span>
              points)
            </button>
          </div>
          <div class="col-4">
            <button
              title="Increase how fast your ball can rotate in revolutions per second"
              id="upgrade-max-rps-button"
              type="button"
              class="btn btn-success"
            >
              Upgrade Max RPS<br />(<span id="upgrade-max-rps-cost">4</span>
              points)
            </button>
          </div>
        </div>
      </div>
    </div>
    <nav id="navbar" class="navbar bg-dark navbar-solid" data-bs-theme="dark">
      <div class="container-fluid">
        <span class="navbar-text"><h1>The Spherical Adventures of Terry</h1></span>
        <div class="d-flex">
          <div class="dropdown">
            <button
              class="btn btn-primary dropdown-toggle me-4"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Reset Level
            </button>
            <ul class="dropdown-menu">
              <li>
                <button class="dropdown-item" id="reset-level-grasslands">
                  Grasslands (Normal)
                </button>
              </li>
              <li>
                <button class="dropdown-item" id="reset-level-tarmac">
                  Tarmac (zero slip)
                </button>
              </li>
              <li>
                <button class="dropdown-item" id="reset-level-ice">
                  Ice (slippy)
                </button>
              </li>
            </ul>
          </div>
          <button
            class="btn btn-primary me-4"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#statsOffcanvas"
            aria-controls="statsOffcanvas"
          >
            Stats
          </button>
          <button
            class="btn btn-primary me-4"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#upgradesOffcanvas"
            aria-controls="upgradesOffcanvas"
          >
            Upgrades
          </button>
        </div>
      </div>
    </nav>
    <canvas id="canvas"></canvas>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="build/index.js"></script>
  </body>
</html>
